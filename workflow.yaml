{
  "schema_version": "1.1.0",
  "initial_state": "READY_FOR_INTAKE",
  "terminal_states": [
    "COMPLETE", "BLOCKED_INPUT", "BLOCKED_INPUT_CONFLICT", "BLOCKED_PLAN",
    "BLOCKED_ARCHITECTURE", "BLOCKED_SECURITY", "BLOCKED_IRREVERSIBLE_ACTION",
    "BLOCKED_EXTERNAL_ACTION", "BLOCKED_GIT"
  ],
  "autonomous_stop_states": [
    "AWAITING_HUMAN_ACCEPTANCE", "BLOCKED_INPUT", "BLOCKED_INPUT_CONFLICT", "BLOCKED_PLAN",
    "BLOCKED_ARCHITECTURE", "BLOCKED_SECURITY", "BLOCKED_IRREVERSIBLE_ACTION",
    "BLOCKED_EXTERNAL_ACTION", "BLOCKED_GIT"
  ],
  "transitions": [
    {"from":"READY_FOR_INTAKE","event":"INTAKE_VALID","to":"INTAKE_CLASSIFIED","action":"classify_ui_need"},
    {"from":"READY_FOR_INTAKE","event":"INTAKE_INVALID","to":"BLOCKED_INPUT","action":"report_missing_inputs"},
    {"from":"INTAKE_CLASSIFIED","event":"UI_NOT_REQUIRED","to":"PLAN_GENERATING","action":"dispatch_planner"},
    {"from":"INTAKE_CLASSIFIED","event":"EXISTING_UI_REUSABLE","to":"PLAN_GENERATING","action":"dispatch_planner_with_existing_ui"},
    {"from":"INTAKE_CLASSIFIED","event":"UI_BASELINE_PROVIDED","to":"PLAN_GENERATING","action":"dispatch_planner_with_provided_ui"},
    {"from":"INTAKE_CLASSIFIED","event":"NEW_UI_BASELINE_REQUIRED","to":"UI_PREPARING","action":"dispatch_ui_preparer"},
    {"from":"UI_PREPARING","event":"UI_BASELINE_READY","to":"UI_REVIEW","action":"dispatch_ui_baseline_reviewer"},
    {"from":"UI_REVIEW","event":"UI_REVIEW_FAILED","to":"UI_PREPARING","action":"dispatch_ui_preparer_for_findings"},
    {"from":"UI_REVIEW","event":"UI_REVIEW_PASSED","to":"PLAN_GENERATING","action":"dispatch_planner_with_generated_ui"},
    {"from":"UI_REVIEW","event":"UI_REVIEW_ROUNDS_EXHAUSTED","to":"BLOCKED_ARCHITECTURE","action":"prepare_ui_architecture_packet"},
    {"from":"PLAN_GENERATING","event":"PLAN_GENERATED","to":"PLAN_REVIEW","action":"dispatch_plan_reviewer"},
    {"from":"PLAN_REVIEW","event":"PLAN_REVIEW_FAILED","to":"PLAN_REWORK","action":"dispatch_planner_for_findings"},
    {"from":"PLAN_REWORK","event":"PLAN_REVISED","to":"PLAN_REVIEW","action":"dispatch_plan_reviewer"},
    {"from":"PLAN_REVIEW","event":"PLAN_REVIEW_PASSED","to":"EXECUTION_READY","action":"run_execution_readiness_check"},
    {"from":"PLAN_REVIEW","event":"PLAN_REVIEW_ROUNDS_EXHAUSTED","to":"BLOCKED_PLAN","action":"prepare_plan_blocker_packet"},
    {"from":"EXECUTION_READY","event":"EXECUTION_READINESS_PASSED","to":"EXECUTING","action":"dispatch_next_task"},
    {"from":"EXECUTION_READY","event":"EXECUTION_READINESS_FAILED","to":"BLOCKED_INPUT","action":"report_execution_readiness_failure"},
    {"from":"EXECUTING","event":"TASK_DISPATCHED","to":"TASK_IMPLEMENTING","action":"wait_for_implementer"},
    {"from":"TASK_IMPLEMENTING","event":"IMPLEMENTATION_DONE","to":"TASK_TESTING","action":"dispatch_tester"},
    {"from":"TASK_IMPLEMENTING","event":"IMPLEMENTATION_BLOCKED","to":"BLOCKED_INPUT","action":"report_blocker"},
    {"from":"TASK_TESTING","event":"TEST_FAILED","to":"TASK_REWORK","action":"dispatch_debugger"},
    {"from":"TASK_TESTING","event":"TEST_PASSED","to":"TASK_REVIEW","action":"dispatch_reviewer"},
    {"from":"TASK_REWORK","event":"FIX_DONE","to":"TASK_TESTING","action":"dispatch_tester"},
    {"from":"TASK_REWORK","event":"DEBUG_ATTEMPT_EXHAUSTED","to":"BLOCKED_ARCHITECTURE","action":"prepare_architecture_packet"},
    {"from":"TASK_REVIEW","event":"REVIEW_FAILED","to":"TASK_REWORK","action":"dispatch_implementer_for_findings"},
    {"from":"TASK_REVIEW","event":"REVIEW_FIX_ROUNDS_EXHAUSTED","to":"BLOCKED_ARCHITECTURE","action":"prepare_architecture_packet"},
    {"from":"TASK_REVIEW","event":"REVIEW_PASSED_MORE_TASKS","to":"EXECUTING","action":"dispatch_next_task"},
    {"from":"TASK_REVIEW","event":"REVIEW_PASSED_ALL_TASKS","to":"REGRESSION","action":"dispatch_full_regression"},
    {"from":"REGRESSION","event":"REGRESSION_FAILED","to":"TASK_REWORK","action":"dispatch_debugger"},
    {"from":"REGRESSION","event":"REGRESSION_PASSED","to":"FINAL_REVIEW","action":"dispatch_final_three_axis_review"},
    {"from":"FINAL_REVIEW","event":"FINAL_REVIEW_FAILED","to":"TASK_REWORK","action":"dispatch_implementer_for_findings"},
    {"from":"FINAL_REVIEW","event":"FINAL_REVIEW_PASSED","to":"AWAITING_HUMAN_ACCEPTANCE","action":"prepare_final_acceptance_package"},
    {"from":"AWAITING_HUMAN_ACCEPTANCE","event":"HUMAN_ACCEPTED","to":"COMPLETE","action":"record_acceptance_without_external_action"},
    {"from":"*","event":"INPUT_CONFLICT","to":"BLOCKED_INPUT_CONFLICT","action":"prepare_conflict_packet"},
    {"from":"*","event":"SECURITY_RISK","to":"BLOCKED_SECURITY","action":"prepare_security_packet"},
    {"from":"*","event":"IRREVERSIBLE_ACTION_REQUIRED","to":"BLOCKED_IRREVERSIBLE_ACTION","action":"request_human_approval"},
    {"from":"*","event":"MERGE_PUSH_DEPLOY_REQUIRED","to":"BLOCKED_EXTERNAL_ACTION","action":"request_human_approval"},
    {"from":"*","event":"GIT_ISOLATION_FAILED","to":"BLOCKED_GIT","action":"preserve_and_report_git_state"}
  ]
}
