{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "defect.schema.yaml",
  "title": "Defect",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version","defect_id","task_id","failed_gate","root_cause_id","attempt","reproducible","commands","failures","evidence","allowed_scope"],
  "properties": {
    "schema_version":{"const":"1.0.0"},
    "defect_id":{"type":"string","minLength":1},
    "task_id":{"type":"string","minLength":1},
    "failed_gate":{"enum":["focused_test","build","typecheck","lint","e2e","visual","regression","review"]},
    "root_cause_id":{"type":"string","minLength":1},
    "attempt":{"type":"integer","minimum":1,"maximum":3},
    "reproducible":{"type":"boolean"},
    "commands":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "failures":{"type":"array","minItems":1,"items":{"type":"object","required":["name","message"]}},
    "evidence":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "suspected_area":{"type":"array","items":{"type":"string"}},
    "allowed_scope":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}}
  }
}
