{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "task-brief.schema.yaml",
  "title": "Task Brief",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version","task_id","title","goal","acceptance_criteria","verification","authorities","dependencies","allowed_scope","forbidden_actions","report_path"],
  "properties": {
    "schema_version":{"const":"1.0.0"},
    "task_id":{"type":"string","minLength":1},
    "title":{"type":"string","minLength":1},
    "goal":{"type":"string","minLength":1},
    "acceptance_criteria":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "verification":{"type":"array","minItems":1,"items":{"type":"object","required":["command","expected"]}},
    "authorities":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "dependencies":{"type":"array","items":{"type":"string"}},
    "interfaces":{"type":"object"},
    "allowed_scope":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "forbidden_actions":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "base_commit":{"type":"string"},
    "report_path":{"type":"string","minLength":1}
  }
}
