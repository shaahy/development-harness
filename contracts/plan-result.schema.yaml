{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "plan-result.schema.yaml",
  "title": "Plan Result",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version","feature_id","round","status","plan_path","spec_coverage","checks","findings","evidence","next_event"],
  "properties": {
    "schema_version":{"const":"1.1.0"},
    "feature_id":{"type":"string","minLength":1},
    "round":{"type":"integer","minimum":1,"maximum":3},
    "status":{"enum":["GENERATED","APPROVED","FINDINGS","ROUNDS_EXHAUSTED"]},
    "plan_path":{"type":"string","minLength":1},
    "spec_coverage":{"type":"array","minItems":1,"items":{"type":"object","required":["requirement","tasks","covered"],"properties":{"requirement":{"type":"string"},"tasks":{"type":"array","items":{"type":"string"}},"covered":{"type":"boolean"}}}},
    "checks":{"type":"object","required":["coverage","dependencies","task_granularity","interfaces","tdd","verification","no_placeholders"],"additionalProperties":{"enum":["PASS","FAIL"]}},
    "findings":{"type":"array","items":{"type":"object","required":["id","severity","problem","required_change"],"properties":{"id":{"type":"string"},"severity":{"enum":["CRITICAL","HIGH","MEDIUM","LOW"]},"problem":{"type":"string"},"required_change":{"type":"string"}}}},
    "evidence":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "next_event":{"enum":["PLAN_GENERATED","PLAN_REVIEW_PASSED","PLAN_REVIEW_FAILED","PLAN_REVIEW_ROUNDS_EXHAUSTED"]}
  }
}

