{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "task-result.schema.yaml",
  "title": "Task Result",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version","task_id","role","status","summary","changed_files","commands","evidence","next_event"],
  "properties": {
    "schema_version":{"const":"1.0.0"},
    "task_id":{"type":"string","minLength":1},
    "role":{"enum":["implementer","tester","debugger","reviewer"]},
    "status":{"enum":["DONE","DONE_WITH_CONCERNS","NEEDS_CONTEXT","BLOCKED","PASSED","FAILED","FIX_DONE","DEBUG_ATTEMPT_EXHAUSTED","APPROVED","FINDINGS","REVIEW_FIX_ROUNDS_EXHAUSTED"]},
    "summary":{"type":"string","minLength":1},
    "changed_files":{"type":"array","items":{"type":"string"}},
    "commands":{"type":"array","items":{"type":"object","required":["command","exit_code","result"],"properties":{"command":{"type":"string"},"exit_code":{"type":"integer"},"result":{"type":"string"}}}},
    "evidence":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},
    "commit_sha":{"type":["string","null"]},
    "concerns":{"type":"array","items":{"type":"string"}},
    "next_event":{"type":"string","minLength":1}
  }
}
